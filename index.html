<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Sign in — Software Engineer Concepts</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&family=Outfit:wght@300;400;500;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/app.css" />
</head>
<body>
  <div class="login-shell">
    <form class="login-card" id="loginForm" novalidate>
      <p class="kicker">Interview preparation</p>
      <h1 id="formTitle">Sign in</h1>
      <p class="lede" style="margin-bottom: 0.5rem">Progress syncs across phone and laptop when you use the same account.</p>

      <label for="email">Email</label>
      <input id="email" name="email" type="email" autocomplete="email" required autofocus />

      <label for="password">Password</label>
      <input id="password" name="password" type="password" autocomplete="current-password" required minlength="6" />

      <p class="error" id="error" role="alert"></p>
      <button type="submit" id="submitBtn">Sign in</button>
      <button type="button" class="btn-text" id="modeToggle" style="width:100%;margin-top:0.75rem">
        Need an account? Create one
      </button>
      <p class="muted-note" id="formNote">Same email on every device keeps your study and test progress.</p>
    </form>
  </div>
  <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore-compat.js"></script>
  <script src="js/firebase-config.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/storage.js"></script>
  <script src="js/sync.js"></script>
  <script>
    let mode = "signin";
    const error = document.getElementById("error");
    const title = document.getElementById("formTitle");
    const submitBtn = document.getElementById("submitBtn");
    const modeToggle = document.getElementById("modeToggle");
    const formNote = document.getElementById("formNote");

    if (!isFirebaseConfigured() || new URLSearchParams(location.search).get("setup") === "1") {
      error.textContent =
        "Add your Firebase web config to js/firebase-config.js, enable Email/Password Auth, create Firestore, and paste firestore.rules in the console.";
    }

    waitForAuthUser().then((user) => {
      if (user) location.replace(safeNext());
    });

    modeToggle.addEventListener("click", () => {
      mode = mode === "signin" ? "register" : "signin";
      const registering = mode === "register";
      title.textContent = registering ? "Create account" : "Sign in";
      submitBtn.textContent = registering ? "Create account" : "Sign in";
      modeToggle.textContent = registering
        ? "Already have an account? Sign in"
        : "Need an account? Create one";
      formNote.textContent = registering
        ? "Use a password with at least 6 characters."
        : "Same email on every device keeps your study and test progress.";
      error.textContent = "";
    });

    function safeNext() {
      const params = new URLSearchParams(location.search);
      const next = params.get("next") || "roles.html";
      const match = String(next).match(/^([a-z0-9.-]+\.html)(\?[^#]*)?(#.*)?$/i);
      return match ? match[1] + (match[2] || "") + (match[3] || "") : "roles.html";
    }

    document.getElementById("loginForm").addEventListener("submit", async (event) => {
      event.preventDefault();
      error.textContent = "";
      submitBtn.disabled = true;
      const idleLabel = submitBtn.textContent;
      submitBtn.textContent = mode === "register" ? "Creating…" : "Signing in…";
      submitBtn.setAttribute("aria-busy", "true");
      const email = document.getElementById("email").value;
      const password = document.getElementById("password").value;
      try {
        if (mode === "register") await register(email, password);
        else await login(email, password);
        location.replace(safeNext());
      } catch (err) {
        error.textContent = authErrorMessage(err);
        submitBtn.disabled = false;
        submitBtn.textContent = idleLabel;
        submitBtn.removeAttribute("aria-busy");
      }
    });
  </script>
</body>
</html>
