<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Choose your role — Interview Prep</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&family=Outfit:wght@300;400;500;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/app.css" />
</head>
<body>
  <div class="wrap role-shell">
    <header class="topbar">
      <div class="brand">Interview Prep</div>
      <button type="button" class="btn-text" id="logoutBtn" disabled>Sign out</button>
    </header>

    <p class="kicker">Signed in</p>
    <h1 style="text-align: center">Choose your role</h1>
    <p class="lede role-lede">Pick the track you are preparing for. You will see this screen after each sign-in.</p>

    <p class="error" id="pageError" role="alert" hidden></p>
    <div id="roleHost" class="role-host" aria-live="polite">
      <div class="placeholder role-loading">Loading roles…</div>
    </div>
  </div>

  <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore-compat.js"></script>
  <script src="js/firebase-config.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/storage.js"></script>
  <script src="js/sync.js"></script>
  <script src="js/roles.js"></script>
  <script src="js/topics.js"></script>
  <script>
    const host = document.getElementById("roleHost");
    const pageError = document.getElementById("pageError");

    function showError(message) {
      pageError.hidden = false;
      pageError.textContent = message;
    }

    function renderRoles(roles) {
      const last = getLastRole();
      const gridClass = roles.length > 1 ? "role-grid role-grid--multi" : "role-grid";
      host.innerHTML = `<div class="${gridClass}" role="list">${roles
        .map((role) => {
          const wasLast = last === role.id;
          const hub = role.hub || "hub.html";
          return `<button type="button" class="role-card" role="listitem" data-role-id="${escapeHtml(role.id)}" data-hub="${escapeHtml(hub)}">
            <span class="role-card-title">${escapeHtml(role.title)}</span>
            ${role.description ? `<span class="role-card-desc">${escapeHtml(role.description)}</span>` : ""}
            ${wasLast ? `<span class="role-card-badge">Last selected</span>` : ""}
          </button>`;
        })
        .join("")}</div>`;

      host.querySelectorAll(".role-card").forEach((button) => {
        button.addEventListener("click", () => selectRole(button.getAttribute("data-role-id"), button));
      });
    }

    function selectRole(roleId, button) {
      if (!roleId) return;
      pageError.hidden = true;
      pageError.textContent = "";
      const cards = host.querySelectorAll(".role-card");
      cards.forEach((el) => {
        el.disabled = true;
        el.classList.remove("is-loading");
      });
      button.classList.add("is-loading");
      button.setAttribute("aria-busy", "true");

      try {
        setSelectedRole(roleId);
        const hub = button.getAttribute("data-hub") || "hub.html";
        location.replace(withRole(hub));
      } catch (err) {
        console.error(err);
        showError("Could not continue. Try again.");
        cards.forEach((el) => {
          el.disabled = false;
          el.classList.remove("is-loading");
          el.removeAttribute("aria-busy");
        });
      }
    }

    function escapeHtml(value) {
      return String(value)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;");
    }

    requireAuth()
      .then((user) => {
        if (!user) return;
        bindLogout();
        return loadRoles()
          .then((data) => {
            if (!data.roles.length) {
              showError("No roles are configured yet.");
              host.innerHTML = "";
              return;
            }
            renderRoles(data.roles);
          })
          .catch((err) => {
            console.error(err);
            host.innerHTML = "";
            showError("Could not load roles. Check your connection and refresh.");
          });
      })
      .catch((err) => {
        console.error(err);
        showError("Session error. Please sign in again.");
      });
  </script>
</body>
</html>
