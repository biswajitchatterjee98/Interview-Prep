<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>CGL Tier 1 — Interview Prep</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&family=Outfit:wght@300;400;500;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="../css/app.css" />
  <link rel="stylesheet" href="../css/cgl.css" />
</head>
<body>
  <div class="wrap wide">
    <header class="topbar">
      <div class="brand">SSC CGL · Tier 1</div>
      <button type="button" class="btn-text" id="logoutBtn" disabled>Sign out</button>
    </header>

    <nav class="crumb" aria-label="Breadcrumb">
      <a href="../roles.html">Roles</a>
      <span>/</span>
      <span aria-current="page">CGL prep</span>
    </nav>

    <div class="cgl-app">
      <div class="cgl-shell">
        <p class="kicker cgl-kicker">Eight-day plan</p>
        <div class="cgl-head">
          <h1 class="cgl-title">Tier 1 before 9 Oct</h1>
          <p class="scoreline" id="overall"></p>
        </div>
        <nav class="days" id="day-nav" aria-label="Study days"></nav>
        <main id="main"></main>
      </div>
    </div>
  </div>

  <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore-compat.js"></script>
  <script src="../js/firebase-config.js"></script>
  <script src="../js/auth.js"></script>
  <script src="../js/storage.js"></script>
  <script src="../js/sync.js"></script>
  <script src="../js/roles.js"></script>
  <script src="../js/topics.js"></script>
  <script src="data.js"></script>
  <script src="notes.js"></script>
  <script src="notes-extra.js"></script>
  <script src="notes-pyq.js"></script>
  <script src="formulas-extra.js"></script>
  <script src="quizzes.js"></script>
  <script src="quizzes-more.js"></script>
  <script src="day-quizzes.js"></script>
  <script src="day-rest.js"></script>
  <script src="mocks.js"></script>
  <script src="app.js"></script>
  <script>
    requireRole().then(function (user) {
      if (!user) return;
      if (getSelectedRole() !== "cgl") {
        location.replace(withRole("../hub.html"));
        return;
      }
      bindLogout();
      const boot = function () {
        if (typeof reloadCglState === "function") reloadCglState();
        if (typeof bootCglApp === "function") bootCglApp();
      };
      if (typeof pullCloudProgress === "function") {
        pullCloudProgress().then(boot).catch(function () {
          boot();
        });
      } else {
        boot();
      }
    });
  </script>
</body>
</html>
